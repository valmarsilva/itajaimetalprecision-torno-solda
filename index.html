    <style>
      body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
      .font-industrial { font-family: 'Orbitron', sans-serif; }
      #root:empty { display: flex; align-items: center; justify-content: center; height: 100vh; background: #020617; }
      #root:empty::after {
        content: "INICIALIZANDO SISTEMA...";
        color: #3b82f6;
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        letter-spacing: 0.5em;
        animation: blink 1.5s infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.95);
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
    </style>

    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "@google/genai": "https://esm.sh/@google/genai@1.41.0",

  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    
    <div id="errorOverlay" class="error-overlay">
      <h2 style="color: #ef4444; font-family: 'Orbitron';">ERRO DE CARREGAMENTO</h2>
      <p style="margin-top: 1rem; color: #94a3b8; text-align: center;">Não foi possível carregar os módulos do frontend na Hostinger.</p>
      <button onclick="location.reload()" style="margin-top: 2rem; background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold;">RECARREGAR SITE</button>
    </div>
    
    <!-- Carregamento do arquivo principal usando Babel -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>

    <script>
      // Se em 10 segundos o React não montar, mostra o erro
      setTimeout(() => {
        if (document.getElementById('root').innerHTML === "") {
          document.getElementById('errorOverlay').style.display = 'flex';
        }
      }, 10000);
    </script>
<!-- Script de integração do chatbot Itajaimetal -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Mensagem inicial
    const welcomeMessage = "👋 Olá, seja bem-vindo à Itajaimetal Usinagem! Somos especialistas em torno, solda técnica (MIG/TIG), prototipagem 3D e suporte emergencial para motores diesel. Como posso ajudar você hoje?";

    // Opções principais
    const options = [
      "📐 Orçamento de Usinagem",
      "⚙️ Serviços de Torno e Solda",
      "🚚 Diesel Emergencial",
      "🔌 Elétrica",
      "🛑 Freio / Válvulas",
      "🖨️ Prototipagem 3D"
    ];

    // Exibir chatbot
    const chatBox = document.createElement("div");
    chatBox.style.position = "fixed";
    chatBox.style.bottom = "20px";
    chatBox.style.right = "20px";
    chatBox.style.width = "300px";
    chatBox.style.height = "400px";
    chatBox.style.background = "#f9f9f9";
    chatBox.style.border = "1px solid #ccc";
    chatBox.style.borderRadius = "10px";
    chatBox.style.padding = "10px";
    chatBox.style.overflowY = "auto";
    chatBox.style.fontFamily = "Arial, sans-serif";
    chatBox.innerHTML = `<p>${welcomeMessage}</p>`;

    // Adicionar botões de opções
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.textContent = opt;
      btn.style.display = "block";
      btn.style.margin = "5px 0";
      btn.style.width = "100%";
      btn.style.padding = "8px";
      btn.style.borderRadius = "5px";
      btn.style.border = "none";
      btn.style.background = "#007bff";
      btn.style.color = "#fff";
      btn.style.cursor = "pointer";
      btn.onclick = () => {
        chatBox.innerHTML += `<p><strong>Você escolheu:</strong> ${opt}</p>`;
        chatBox.innerHTML += `<p>✅ Sua solicitação foi registrada. Nossa equipe entrará em contato em breve!</p>`;
      };
      chatBox.appendChild(btn);
    });

    document.body.appendChild(chatBox);
  });
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("PWA ativo!"));
  }
</script>

    
  </body>
</html>
