<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itajaí Metal | Torno e Solda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        margin: 0;
        padding: 0;
      }
      .font-industrial {
        font-family: 'Orbitron', sans-serif;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #020617;
      }
      #root:empty::after {
        content: "INICIALIZANDO SISTEMA...";
        color: #3b82f6;
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        letter-spacing: 0.4em;
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .load-error {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 9999;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "fs/": "https://esm.sh/fs@^0.0.1-security/",
    "body-parser": "https://esm.sh/body-parser@^2.2.2",
    "path": "https://esm.sh/path@^0.12.7",
    "express": "https://esm.sh/express@^5.2.1",
    "cors": "https://esm.sh/cors@^2.8.6",
    "url": "https://esm.sh/url@^0.11.4",
    "compression": "https://esm.sh/compression@^1.8.1"
  }
}
</script>
</head>
  <body class="text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <div id="errorMessage" class="load-error font-industrial">ERRO DE CONEXÃO - RECARREGUE A PÁGINA</div>
    
    <script type="module">
      window.addEventListener('error', function(e) {
        // Se houver erro de carregamento de script, mostra o aviso
        if (e.target.tagName === 'SCRIPT') {
          document.getElementById('errorMessage').style.display = 'block';
        }
      }, true);

      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          document.getElementById('errorMessage').style.display = 'block';
        }
      }, 12000);
    </script>
    
    <!-- Importante: Na Hostinger sem build, o navegador precisa ler o index.tsx como módulo -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
