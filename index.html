<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itajaí Metal | Torno e Solda</title>
    
    <!-- Scripts Base -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel para ler TSX direto no navegador (Essencial para Hostinger sem Build) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
      .font-industrial { font-family: 'Orbitron', sans-serif; }
      #root:empty { display: flex; align-items: center; justify-content: center; height: 100vh; background: #020617; }
      #root:empty::after {
        content: "INICIALIZANDO ITAJAÍ METAL...";
        color: #3b82f6;
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        letter-spacing: 0.5em;
        animation: blink 1.5s infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 23, 0.95);
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
    </style>

    <script>
      // Mock do process.env para o navegador não travar ao carregar o Gemini
      window.process = {
        env: {
          API_KEY: "" // Será injetada pelo servidor ou usada via variável de ambiente
        }
      };
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "express": "https://esm.sh/express@^5.2.1",
    "path": "https://esm.sh/path@^0.12.7",
    "cors": "https://esm.sh/cors@^2.8.6",
    "compression": "https://esm.sh/compression@^1.8.1",
    "url": "https://esm.sh/url@^0.11.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    
    <div id="errorOverlay" class="error-overlay">
      <h2 style="color: #ef4444; font-family: 'Orbitron';">SISTEMA OFFLINE</h2>
      <p style="margin-top: 1rem; color: #94a3b8;">Houve um erro de carregamento de módulos na Hostinger.</p>
      <button onclick="location.reload()" style="margin-top: 2rem; background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">TENTAR NOVAMENTE</button>
    </div>
    
    <!-- Script Principal como Módulo Babel -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>

    <script>
      // Verificador de carregamento
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          document.getElementById('errorOverlay').style.display = 'flex';
        }
      }, 15000);

      window.onerror = function(msg, url, line) {
        console.error("Erro de Sistema:", msg, "em", url, ":", line);
        return false;
      };
    </script>
  </body>
</html>
